unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on
set -g default-terminal "tmux-256color"

set-option -g status-position top

# Use Shift + Alt to switch windows
bind -n M-H previous-window
bind -n M-L next-window
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

#-------------------------------------------------------------------------------
# catppuccin theme

set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_number_position "right"

# v2 renamed the "fill" concept away (number-badge-only is now the only mode)
# and dropped the "default_" prefix on the text-content option.
# "custom" leaves our separators (below) alone; "rounded" was tried but its
# reverse-video trick renders the end caps with a visible 1-2px vertical seam
# in this terminal/font, so the caps are hand-built instead, matching exactly
# how v1 did it (explicit fg/bg per role, no reverse video).
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Match the old v1 default palette (blue for inactive windows, peach/orange for
# the current one) since v2 changed these defaults to a muted grey/mauve.
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text_color "#{@thm_bg}"

# Hand-built rounded caps (v1-style: explicit fg/bg, no reverse video).
# left_separator gives the text pill its rounded left edge (fg=text_color on
# a transparent bg). middle_separator is just a space (breathing room before
# the badge, flat/straight edge into it - only right_separator curves, going
# back out to the transparent bg). No cap glyph here and no literal " █"
# block: either one made the number badge asymmetric or wider than intended.
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_text_color},bg=default]"
set -g @catppuccin_window_middle_separator "#[bg=#{@catppuccin_window_text_color}] "
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_number_color},bg=default] "

set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_text_color},bg=default]"
set -g @catppuccin_window_current_middle_separator "#[bg=#{@catppuccin_window_current_text_color}] "
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_number_color},bg=default] "

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# v2+ dropped @catppuccin_status_modules_right/_left in favor of assembling
# status-right/status-left manually from the built @catppuccin_status_* vars.
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

#-------------------------------------------------------------------------------
# vim-tmux navigation

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
